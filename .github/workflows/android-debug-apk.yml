name: Oblivion Debug APK

on:
  push:
    branches:
      - oblivion/m13-device-validation
      - oblivion/m14-device-fixes

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare CI-only google-services.json
        run: |
          set -euo pipefail
          echo "Using a CI-only Firebase placeholder; no Firebase credential is injected."
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": ""
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Validate Oblivion identity resources
        run: python3 tools/validate_m14_resources.py

      - name: Setup Java JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build Debug APK and run unit tests
        run: ./gradlew --no-daemon assembleDebug :app:testDebugUnitTest

      - name: Verify arm64 native library packaging and gxcore dependencies
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          entries="$(unzip -Z1 "$apk")"
          for library in \
            libgxcore.so \
            libc++_shared.so \
            libPlayFabMultiplayer.so \
            libmaesdk.so \
            libinbuiltmods.so; do
            if ! grep -Fxq "lib/arm64-v8a/$library" <<< "$entries"; then
              echo "Missing required APK library: lib/arm64-v8a/$library" >&2
              exit 1
            fi
          done

          readelf="$(command -v llvm-readelf || true)"
          if [[ -z "$readelf" || ! -x "$readelf" ]]; then
            readelf=""
            ndk_search_dirs=()
            ndk_candidate_paths=()

            for ndk_root in "${ANDROID_NDK_HOME:-}" "${ANDROID_NDK_ROOT:-}"; do
              if [[ -n "$ndk_root" ]]; then
                ndk_candidate_paths+=("$ndk_root")
                if [[ -d "$ndk_root" ]]; then
                  ndk_search_dirs+=("$ndk_root")
                fi
              fi
            done

            for sdk_root in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}"; do
              if [[ -n "$sdk_root" ]]; then
                for ndk_path in \
                  "$sdk_root/ndk/28.2.13676358" \
                  "$sdk_root/ndk" \
                  "$sdk_root/ndk-bundle"; do
                  ndk_candidate_paths+=("$ndk_path")
                  if [[ -d "$ndk_path" ]]; then
                    ndk_search_dirs+=("$ndk_path")
                  fi
                done
              fi
            done

            for ndk_path in "${ndk_search_dirs[@]}"; do
              candidate="$(find -L "$ndk_path" -name llvm-readelf -print -quit 2>/dev/null || true)"
              if [[ -n "$candidate" && -x "$candidate" ]]; then
                readelf="$candidate"
                break
              fi
            done

            if [[ -z "$readelf" ]]; then
              echo "Unable to locate an executable llvm-readelf via PATH or the installed Android NDK directories." >&2
              printf 'ANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\nANDROID_NDK_HOME=%s\nANDROID_NDK_ROOT=%s\n' \
                "${ANDROID_SDK_ROOT:-<unset>}" \
                "${ANDROID_HOME:-<unset>}" \
                "${ANDROID_NDK_HOME:-<unset>}" \
                "${ANDROID_NDK_ROOT:-<unset>}" >&2
              printf 'NDK paths checked:\n' >&2
              if [[ "${#ndk_candidate_paths[@]}" -eq 0 ]]; then
                echo '  (none; no NDK or SDK environment paths were set)' >&2
              else
                printf '  %s\n' "${ndk_candidate_paths[@]}" >&2
              fi
              exit 1
            fi
          fi

          if ! readelf_version="$("$readelf" --version 2>&1)"; then
            printf 'Found llvm-readelf at %s, but could not run --version:\n%s\n' "$readelf" "$readelf_version" >&2
            exit 1
          fi
          printf 'Resolved llvm-readelf: %s\n%s\n' "$readelf" "$readelf_version"

          gxcore="$RUNNER_TEMP/libgxcore.so"
          unzip -p "$apk" lib/arm64-v8a/libgxcore.so > "$gxcore"

          if ! header="$("$readelf" --file-header "$gxcore" 2>&1)"; then
            printf 'Unable to read libgxcore.so ELF header:\n%s\n' "$header" >&2
            exit 1
          fi
          if ! program_headers="$("$readelf" --program-headers "$gxcore" 2>&1)"; then
            printf 'Unable to read libgxcore.so program headers:\n%s\n' "$program_headers" >&2
            exit 1
          fi
          if ! dynamic="$("$readelf" --dynamic "$gxcore" 2>&1)"; then
            printf 'Unable to read libgxcore.so dynamic section:\n%s\n' "$dynamic" >&2
            exit 1
          fi

          printf '%s\n' '=== libgxcore.so ELF header ===' "$header"
          printf '%s\n' '=== libgxcore.so program headers ===' "$program_headers"
          printf '%s\n' '=== libgxcore.so dynamic section ===' "$dynamic"

          if ! grep -Eq 'Class:[[:space:]]+ELF64' <<< "$header"; then
            echo "Invalid libgxcore.so: expected ELF64." >&2
            exit 1
          fi
          if ! grep -Eq "Data:[[:space:]]+2's complement, little endian" <<< "$header"; then
            echo "Invalid libgxcore.so: expected little-endian ELF data." >&2
            exit 1
          fi
          if ! grep -Eq 'Type:[[:space:]]+DYN([[:space:]]|$)' <<< "$header"; then
            echo "Invalid libgxcore.so: expected ET_DYN shared object." >&2
            exit 1
          fi
          if ! grep -Eq 'Machine:[[:space:]]+AArch64([[:space:]]|$)' <<< "$header"; then
            echo "Invalid libgxcore.so: expected AArch64 machine architecture." >&2
            exit 1
          fi
          if ! grep -Eq '(^|[[:space:]])DYNAMIC([[:space:]]|$)' <<< "$program_headers"; then
            echo "Invalid libgxcore.so: expected a PT_DYNAMIC program header." >&2
            exit 1
          fi
          if ! grep -Eq 'Dynamic section at offset ' <<< "$dynamic"; then
            echo "Invalid libgxcore.so: PT_DYNAMIC exists but no valid dynamic section was reported." >&2
            exit 1
          fi

          needed="$(printf '%s\n' "$dynamic" | grep 'NEEDED' || true)"
          if [[ -z "$needed" ]]; then
            echo "No DT_NEEDED entries are declared for libgxcore.so; runtime dependency compatibility is not verified."
          else
            printf 'DT_NEEDED entries declared for libgxcore.so:\n%s\n' "$needed"
          fi
          echo "ELF packaging inspection does not verify runtime compatibility."

      - name: Verify Debug APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oblivion-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
